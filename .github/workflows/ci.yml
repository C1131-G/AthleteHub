name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun run check
      - run: bun run typecheck
      - run: bun test features lib

  package-smoke:
    name: Unpacked package (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--dir` skips installer generation: it proves the renderer, backend
      # bundle and native `@libsql` copy all land in the app tree, in a fraction
      # of the time a full release build takes.
      - name: Build and pack without installers
        run: bun run package:dir
