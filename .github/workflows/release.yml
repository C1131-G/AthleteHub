name: Release

# Tag a commit as `v0.1.0` and push it to build the Windows installer and
# attach it to a draft GitHub release. `workflow_dispatch` builds the same
# thing without publishing, for verifying a packaging change before tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build renderer and backend bundle
        run: bun run dist:prepare

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bunx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - uses: actions/upload-artifact@v4
        with:
          name: SSAIT-Athlete360-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
