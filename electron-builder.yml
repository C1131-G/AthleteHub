appId: com.ssait.athlete360
productName: SSAIT Athlete360
copyright: Copyright © 2026 SSAIT

directories:
  buildResources: build-resources
  output: release

# The renderer is served by the standalone Next server, so the asar only needs
# the main process. Application dependencies ship inside the standalone bundle.
files:
  - electron/**/*
  - package.json
  - "!node_modules/**"
  # electron-updater runs in the main process (electron/ipc/updates.cjs), so
  # unlike renderer/backend dependencies it isn't bundled by anything — it
  # and its runtime dependency closure have to ship in the asar explicitly.
  # Kept as one list per package (rather than a single "electron-updater/**")
  # so a missing transitive dependency fails loudly as a packaging error
  # instead of a runtime "Cannot find module" in the shipped app.
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/debug/**/*
  - node_modules/sax/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/ms/**/*
  - node_modules/zod/**/*

# Kept outside the asar: the Next server resolves `.next` and `public` from the
# real filesystem relative to server.js.
extraResources:
  - from: .next/standalone
    to: standalone
    # Without an explicit filter the default matcher drops the dot-prefixed
    # `.next` directory. `node_modules` is stripped regardless, so afterPack
    # restores it.
    filter:
      - "**/*"
  - from: .next/electron-backend.mjs
    to: backend/electron-backend.mjs

asar: true
afterPack: scripts/after-pack.mjs

# The app has no i18n — every string is hard-coded English — so Electron's
# other ~54 bundled Chromium locale .pak files (~47 MB) are pure dead weight.
# Native OS dialogs (open/save, etc.) render in English regardless of system
# language, which is the accepted tradeoff until the app itself is localized.
electronLanguages:
  - en-US

# Every runtime dependency ships inside `.next/standalone`, and `@libsql` uses
# prebuilt binaries rather than node-gyp, so there is nothing to rebuild — and
# rebuilding would fail anyway now that `node_modules` is excluded from `files`.
npmRebuild: false

# One predictable name per platform/arch so release assets are unambiguous and
# the README download links stay stable across versions. Spelled out rather
# than built from ${productName}, which now contains a space that would end up
# percent-encoded in every download URL.
artifactName: SSAIT-Athlete360-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: C1131-G
  repo: AthleteHub

win:
  # `zip` is the no-installer option for locked-down machines.
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SSAIT Athlete360
  # Adds the data/backup folder page (build-resources/installer.nsh) right
  # after the install-location page, so first-run folder choice happens
  # during the installer instead of the app's own first-launch screen.
  include: build-resources/installer.nsh
  # The bundled NSIS compiler (3.0.4, from 2018) emits a false-positive
  # "not referenced - zeroing code out" for our page-callback functions —
  # they're only reachable through electron-builder's own
  # customPageAfterChangeDir macro (in a different, later-processed file),
  # which its dead-code scanner doesn't see across. GetFunctionAddress (in
  # installer.nsh's customInit) didn't change the warning either. Confirmed
  # by actually running the built installer that the page and its
  # functions work correctly with this off — see build-resources/installer.nsh.
  warningsAsErrors: false
